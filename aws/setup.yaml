AWSTemplateFormatVersion: 2010-09-09
Description: Battleship Game Template
Parameters:
  BattleshipGameWebsiteBucketName:
    Type: String
    Description: S3 Bucket name for battleship game website
    Default: battleship-game-997
  GitHubRepositoryURL:
    Type: String
    Description: URL for GitHub repository with battleship game website files
    Default: https://raw.githubusercontent.com/NowakArtur97/Battleship-Game/main
  FilesToCopyFromGitHub:
    Type: String
    Description: Battleship game website files to copy from GitHub to S3 bucket
    Default: client/index.html,client/style.css,client/battleship.js,client/assets/24x24/enemy-ship-24x24.png,client/assets/24x24/enemy-sinking-ship-24x24.png,client/assets/24x24/player-ship-24x24.png,client/assets/24x24/player-sinking-ship-24x24.png,client/assets/24x24/water-24x24.png,client/assets/24x24/x-mark-24x24.png,client/assets/48x48/enemy-ship-48x48.png,client/assets/48x48/enemy-sinking-ship-48x48.png,client/assets/48x48/player-ship-48x48.png,client/assets/48x48/player-sinking-ship-48x48.png,client/assets/48x48/water-48x48.png,client/assets/48x48/x-mark-48x48.png
  FoldersToBeSkipped:
    Type: String
    Description: Battleship game folders to skip when copying files from GitHub to S3
    Default: client
  InstanceType:
    Type: String
    Description: EC2 instances size
    Default: t2.micro
  ImageId:
    Type: String
    Description: EC2 instances image id
    Default: ami-09e6f87a47903347c
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an EC2 KeyPair to enable SSH access to the instance
    Default: battleship-game
  SshPort:
    Type: Number
    Description: SSH port
    Default: 22
    MinValue: 22
    MaxValue: 65535
  SourceCidr:
    Type: String
    Description: CIDR Block of IPv4 IP addresses allowed to access EC2 instances via SSH
    AllowedPattern: "^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?).){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(/([0-9]|[1-2][0-9]|3[0-2]))?$"
    ConstraintDescription: The value must be valid IPv4 CIDR block.
    Default: 0.0.0.0/32
  FileWithBackendIP:
    Type: String
    Description: File with backend IP to be replaced by lambda function
    Default: battleship.js
Resources:
  BattleshipGameWebsiteS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BattleshipGameWebsiteBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
  BattleshipGameWebsiteS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BattleshipGameWebsiteS3Bucket
      PolicyDocument:
        Id: BattleshipGameWebsiteS3BucketPolicy
        Version: 2012-10-17
        Statement:
          - Sid: PublicReadForGetBucketObjects
            Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${BattleshipGameWebsiteS3Bucket}/*"
  GitHubToS3LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      Policies:
        - PolicyName: GitHubToS3LambdaFunctionPolicies
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${BattleshipGameWebsiteS3Bucket}/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
  GitHubToS3LambdaInvoke:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: GitHubToS3LambdaFunction
    Version: "1.0"
    Properties:
      ServiceToken: !GetAtt GitHubToS3LambdaFunction.Arn
  GitHubToS3LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Timeout: 120
      Handler: index.lambda_handler
      Role: !GetAtt GitHubToS3LambdaRole.Arn
      Environment:
        Variables:
          BUCKET_NAME: !Ref BattleshipGameWebsiteS3Bucket
          GITHUB_URL: !Ref GitHubRepositoryURL
          FILES_TO_COPY: !Ref FilesToCopyFromGitHub
          FOLDERS_TO_BE_SKIPPED: !Ref FoldersToBeSkipped
      Code:
        ZipFile: |
          import os
          import urllib.request
          import boto3
          from urllib.parse import urlparse
          import cfnresponse

          s3 = boto3.resource('s3')
          BUCKET_NAME = os.environ['BUCKET_NAME']
          GITHUB_URL = os.environ['GITHUB_URL']
          FILES_TO_COPY = os.environ['FILES_TO_COPY'].split(",")
          FOLDERS_TO_BE_SKIPPED = os.environ['FOLDERS_TO_BE_SKIPPED'].split(",")

          def save_to_local(url):
              urlPath = urlparse(url).path
              fileName = os.path.basename(urlPath)
              filePath = '/tmp/' + fileName
              urllib.request.urlretrieve(url, filePath)
              return filePath

          def copy_to_s3(url, folder, contentType):
              filePath = save_to_local(url)
              fileName = os.path.basename(filePath)
              s3.Object(BUCKET_NAME, folder + fileName).put(Body=open(filePath, 'rb'), ContentType=contentType)

          def resolve_content_type(file):
              extension = file.split(".")[1]
              if extension == "html":
                  return "text/html"
              elif extension == "css":
                  return "text/css"
              elif extension == "js":
                  return "text/javascript"
              elif extension == "py":
                  return "text/x-python"
              elif extension in ["jpeg", "jpg"]:
                  return "image/jpeg"
              elif extension == "png":
                  return "image/png"
              elif extension == "tiff":
                  return "image/tiff"
              elif extension == "bmp":
                  return "image/bmp"
              elif extension == "gif":
                  return "image/gif"
              elif extension in ["svg", "xml"]:
                  return "image/svg+xml"
              elif extension in ["mp3", "wav", "ogg"]:
                  return "audio/mpeg"
              elif extension == "pdf":
                  return "application/pdf"
              elif extension == "zip":
                  return "application/zip"
              elif extension == "yaml":
                  return "binary/octet-stream"
              else:
                  return "text/plain"

          def lambda_handler(event, context):
              responseData = {}
              requestType = event['RequestType']
              try:
                  if requestType == 'Create':
                      for fileToCopy in FILES_TO_COPY:
                          fileOnGitHub = GITHUB_URL + "/" + fileToCopy
                          print("File to copy: " + fileToCopy)
                          print("URL to file: " + fileOnGitHub)
                          folder = fileToCopy[:fileToCopy.rfind("/")] + '/' if '/' in fileToCopy else ''
                          for toSkip in FOLDERS_TO_BE_SKIPPED:
                              folder = folder.replace(toSkip + "/", "")
                          contentType = resolve_content_type(fileToCopy)
                          copy_to_s3(fileOnGitHub, folder, contentType)
                          print("Successfully copied file: " + folder + '/' + fileToCopy + " to bucket: " + BUCKET_NAME)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
              except Exception as e:
                  print("Exception when copying files from GitHub to S3 bucket: " + BUCKET_NAME)
                  print(e)
                  cfnresponse.send(event, context, cfnresponse.FAILED, responseData)
  S3BucketCleanerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      Policies:
        - PolicyName: S3BucketCleanerLambdaFunctionPolicies
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${BattleshipGameWebsiteS3Bucket}"
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::${BattleshipGameWebsiteS3Bucket}/*"
  S3BucketCleanerLambdaInvoke:
    Type: AWS::CloudFormation::CustomResource
    Version: "1.0"
    Properties:
      ServiceToken: !GetAtt S3BucketCleanerLambdaFunction.Arn
  S3BucketCleanerLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Timeout: 60
      Handler: index.lambda_handler
      Role: !GetAtt S3BucketCleanerLambdaRole.Arn
      Environment:
        Variables:
          BUCKETS_TO_CLEAN: !Ref BattleshipGameWebsiteS3Bucket
      Code:
        ZipFile: |
          import os.path
          import boto3
          import cfnresponse

          BUCKETS_TO_CLEAN = os.environ['BUCKETS_TO_CLEAN'].split(",")

          s3 = boto3.resource('s3')

          def clear_bucket(bucketName):
              s3.Bucket(bucketName).objects.all().delete()

          def lambda_handler(event, context):
              responseData = {}
              if event['RequestType'] == 'Delete':
                  for bucketName in BUCKETS_TO_CLEAN:
                      try:
                          clear_bucket(bucketName)
                          print("Successfully cleared bucket: " + bucketName)
                          cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
                      except Exception as e:
                          print('Exception when cleaning bucket: ' + bucketName)
                          print(e)
                          cfnresponse.send(event, context, cfnresponse.FAILED, responseData)
              else:
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.16.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: battleship-game-vpc
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: battleship-game-igw
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: battleship-game-rt
  RouteTableDefaultIPv4:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.16.0.0/27
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: battleship-game-sn
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: A Security Group for EC2 instances
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: -1
        - CidrIp: 0.0.0.0/0
          FromPort: 8080
          ToPort: 8080
          IpProtocol: tcp
        - CidrIp: !Ref SourceCidr
          FromPort: !Ref SshPort
          ToPort: !Ref SshPort
          IpProtocol: tcp
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: -1
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref Subnet
      SecurityGroupIds:
        - !Ref SecurityGroup
      KeyName: !Ref KeyPairName
      Tags:
        - Key: Name
          Value: battleship-game-ec2
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install docker -y
          service docker start
          docker run -p 8080:8080 -t jooki997/battleship-game:1.0.0
  ReplaceInS3BucketLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      Policies:
        - PolicyName: ReplaceInS3BucketLambdaFunctionPolicies
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${BattleshipGameWebsiteS3Bucket}/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
  ReplaceInS3BucketLambdaInvoke:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: GitHubToS3LambdaInvoke
    Version: "1.0"
    Properties:
      ServiceToken: !GetAtt ReplaceInS3BucketLambdaFunction.Arn
  ReplaceInS3BucketLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.9
      Timeout: 60
      Handler: index.lambda_handler
      Role: !GetAtt ReplaceInS3BucketLambdaRole.Arn
      Environment:
        Variables:
          FILE_NAME: !Ref FileWithBackendIP
          BUCKET_NAME: !Ref BattleshipGameWebsiteS3Bucket
          VALUES_TO_REPLACE: TEMP_SERVER_IP
          VALUES_TO_BE_REPLACED: !Sub ${EC2Instance.PublicIp}
      Code:
        ZipFile: |
          import os
          import cfnresponse
          import boto3

          FILE_NAME = os.environ['FILE_NAME']
          BUCKET_NAME = os.environ['BUCKET_NAME']
          VALUES_TO_REPLACE = os.environ['VALUES_TO_REPLACE'].split(",")
          VALUES_TO_BE_REPLACED = os.environ['VALUES_TO_BE_REPLACED'].split(",")

          TMP_FILE_PATH = '/tmp/' + FILE_NAME

          s3 = boto3.resource('s3')

          def download_file():
            bucket = s3.Bucket(BUCKET_NAME)
            bucket.download_file(FILE_NAME, TMP_FILE_PATH)

          def read_file():
              with open(TMP_FILE_PATH, 'r') as file:
                filedata = file.read()
              return filedata

          def reaplce_values_in_file(filedata):
              for index, toReplace in enumerate(VALUES_TO_REPLACE):
                toBeReplaced = VALUES_TO_BE_REPLACED[index]
                filedata = filedata.replace(toReplace, toBeReplaced)
                print("Changed value from: " + toReplace + " to: " + toBeReplaced + " in file: " + FILE_NAME)
              return filedata

          def save_new_values_to_file(filedata):
              with open(TMP_FILE_PATH, 'w') as file:
                file.write(filedata)

          def upload_updated_file_to_s3():
              s3.Object(BUCKET_NAME, FILE_NAME).put(Body=open(TMP_FILE_PATH, 'rb').read())

          def lambda_handler(event, context):
              responseData = {}
              requestType = event['RequestType']
              try:
                if requestType == 'Create':
                  download_file()
                  filedata = read_file()
                  filedata = reaplce_values_in_file(filedata)
                  save_new_values_to_file(filedata)
                  upload_updated_file_to_s3()
                  print("Successfully updated file: " + FILE_NAME + " in bucket: " + BUCKET_NAME)
                cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
              except Exception as e:
                print("Exception when updated file: " + FILE_NAME + " in bucket: " + BUCKET_NAME)
                print(e)
                cfnresponse.send(event, context, cfnresponse.FAILED, responseData)
Outputs:
  BattleshipGameWebsiteUrl:
    Description: Battleship game website url
    Value: !GetAtt BattleshipGameWebsiteS3Bucket.WebsiteURL
  BattleshipGameBackendServerPublicIp:
    Description: Backend server EC2 instance public IP
    Value: !GetAtt EC2Instance.PublicIp
